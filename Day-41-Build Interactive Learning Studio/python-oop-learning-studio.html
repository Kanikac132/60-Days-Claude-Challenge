<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Learning Studio — Python OOP</title>
<style>
:root{
  --bg:#0B0E1A; --bg2:#111528; --surface:#161B33; --surface2:#1D2340; --line:#2A3055;
  --text:#EDEFF7; --text-dim:#9CA3C4; --text-faint:#5D6389;
  --accent:#7C6FF0; --accent-dim:rgba(124,111,240,0.15); --accent2:#4B8BBE; --accent3:#FFD43B;
  --good:#4ADE80; --good-dim:rgba(74,222,128,0.14);
  --bad:#FB7185; --bad-dim:rgba(251,113,133,0.14);
  --warn:#FBBF24; --warn-dim:rgba(251,191,36,0.14);
  --radius:14px; --mono:ui-monospace,'SFMono-Regular','JetBrains Mono',Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,ui-sans-serif,sans-serif;
}
[data-theme="light"]{
  --bg:#F7F8FC; --bg2:#FFFFFF; --surface:#FFFFFF; --surface2:#F0F1FA; --line:#E1E3F0;
  --text:#181B2E; --text-dim:#565C82; --text-faint:#9297B8;
  --accent-dim:rgba(124,111,240,0.10);
  --good-dim:rgba(34,197,94,0.10); --bad-dim:rgba(244,63,94,0.10); --warn-dim:rgba(245,158,11,0.10);
}
*{box-sizing:border-box; margin:0; padding:0;}
html{scroll-behavior:smooth;}
body{
  background:var(--bg); color:var(--text); font-family:var(--sans);
  min-height:100vh; transition:background 0.3s ease, color 0.3s ease;
}
::selection{background:var(--accent-dim); color:var(--accent);}
::-webkit-scrollbar{width:10px;} ::-webkit-scrollbar-thumb{background:var(--line); border-radius:8px;}
a{color:var(--accent2);}
code{font-family:var(--mono); background:var(--surface2); padding:2px 6px; border-radius:5px; font-size:0.9em; color:var(--accent3);}
pre{
  font-family:var(--mono); background:var(--bg2); border:1px solid var(--line); border-radius:10px;
  padding:16px 18px; overflow-x:auto; font-size:13.5px; line-height:1.6; color:var(--text);
}
pre code{background:none; padding:0; color:inherit;}
.kw{color:#C792EA;} .str{color:#C3E88D;} .fn{color:#82AAFF;} .cm{color:var(--text-faint); font-style:italic;} .nm{color:#F78C6C;}

/* ---------- App shell ---------- */
.app{ display:grid; grid-template-columns:280px 1fr; min-height:100vh; }
@media (max-width:960px){ .app{ grid-template-columns:1fr; } }

/* ---------- Sidebar ---------- */
.sidebar{
  background:var(--surface); border-right:1px solid var(--line);
  padding:22px 18px; position:sticky; top:0; height:100vh; overflow-y:auto;
  display:flex; flex-direction:column; gap:22px;
}
@media (max-width:960px){
  .sidebar{ position:relative; height:auto; border-right:none; border-bottom:1px solid var(--line); }
}
.brand{ display:flex; align-items:center; gap:10px; }
.brand-mark{
  width:34px; height:34px; border-radius:9px; flex-shrink:0;
  background:linear-gradient(145deg, var(--accent), var(--accent2));
  display:flex; align-items:center; justify-content:center; font-family:var(--mono); font-weight:700; color:#0B0E1A; font-size:15px;
}
.brand-text .t1{ font-size:13px; font-weight:700; letter-spacing:0.02em; }
.brand-text .t2{ font-size:10.5px; color:var(--text-faint); font-family:var(--mono); letter-spacing:0.04em; }

.xp-card{
  background:var(--surface2); border:1px solid var(--line); border-radius:12px; padding:14px;
}
.xp-row{ display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
.xp-label{ font-size:11px; color:var(--text-faint); font-family:var(--mono); letter-spacing:0.06em; text-transform:uppercase; }
.xp-val{ font-family:var(--mono); font-weight:700; color:var(--accent3); font-size:14px; }
.progress-track{ height:7px; background:var(--line); border-radius:5px; overflow:hidden; }
.progress-fill{ height:100%; background:linear-gradient(90deg, var(--accent), var(--accent2)); border-radius:5px; transition:width 0.6s ease; width:0%; }
.badges-row{ display:flex; gap:6px; margin-top:12px; flex-wrap:wrap; }
.badge-chip{
  width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-size:11px; font-weight:700; font-family:var(--mono); background:var(--line); color:var(--text-faint);
  border:1px solid var(--line);
}
.badge-chip.earned{ background:linear-gradient(145deg, var(--accent3), var(--accent2)); color:#0B0E1A; border-color:transparent; }

nav.navlist{ display:flex; flex-direction:column; gap:4px; flex:1; }
.nav-item{
  display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:9px; cursor:pointer;
  font-size:13.5px; color:var(--text-dim); transition:background 0.15s ease, color 0.15s ease; border:1px solid transparent;
}
.nav-item:hover{ background:var(--surface2); }
.nav-item.active{ background:var(--accent-dim); color:var(--accent); border-color:rgba(124,111,240,0.25); font-weight:600; }
.nav-item.locked{ opacity:0.4; cursor:not-allowed; }
.nav-dot{ width:20px; height:20px; border-radius:50%; border:1px solid var(--line); flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:10px; font-family:var(--mono); color:var(--text-faint); }
.nav-dot.done{ background:var(--good); border-color:var(--good); color:#0B0E1A; }
.nav-dot.current{ border-color:var(--accent); color:var(--accent); }
.nav-sub{ font-size:10px; color:var(--text-faint); }

.theme-toggle{
  display:flex; align-items:center; justify-content:space-between; padding:10px 4px; font-size:12px; color:var(--text-dim);
}
.toggle-btn{
  width:42px; height:24px; border-radius:14px; background:var(--line); position:relative; cursor:pointer; border:none;
}
.toggle-btn::after{ content:""; position:absolute; width:18px; height:18px; border-radius:50%; background:var(--accent); top:3px; left:3px; transition:left 0.2s ease; }
[data-theme="light"] .toggle-btn::after{ left:21px; }

/* ---------- Main ---------- */
main{ padding:34px 40px 90px; max-width:980px; }
@media (max-width:640px){ main{ padding:22px 18px 70px; } }
.section{ display:none; animation:fadein 0.4s ease; }
.section.active{ display:block; }
@keyframes fadein{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }

.eyebrow{ font-family:var(--mono); font-size:11.5px; letter-spacing:0.12em; text-transform:uppercase; color:var(--accent); margin-bottom:10px; }
h1.page-title{ font-size:clamp(26px,4vw,36px); font-weight:800; margin-bottom:12px; letter-spacing:-0.01em; }
p.lead{ color:var(--text-dim); font-size:15.5px; line-height:1.7; max-width:720px; margin-bottom:8px; }

.grid-cards{ display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px; margin:26px 0; }
.info-card{ background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:16px 18px; }
.info-card .ic-label{ font-family:var(--mono); font-size:10.5px; letter-spacing:0.08em; text-transform:uppercase; color:var(--text-faint); margin-bottom:6px; }
.info-card .ic-val{ font-size:14.5px; font-weight:600; line-height:1.5; }

.reward-banner{
  background:linear-gradient(120deg, var(--accent-dim), transparent);
  border:1px solid var(--line); border-radius:14px; padding:18px 20px; margin:24px 0; display:flex; gap:16px; align-items:center;
}
.reward-banner .rb-icon{ font-family:var(--mono); font-weight:800; font-size:20px; color:var(--accent3); background:var(--surface2); width:48px; height:48px; border-radius:12px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.reward-banner p{ font-size:13.5px; color:var(--text-dim); line-height:1.6; }
.reward-banner strong{ color:var(--text); }

.start-btn{
  margin-top:20px; background:var(--accent); color:#0B0E1A; border:none; border-radius:10px; padding:14px 26px;
  font-size:14.5px; font-weight:700; cursor:pointer; display:inline-flex; align-items:center; gap:8px;
  transition:transform 0.15s ease, box-shadow 0.15s ease;
}
.start-btn:hover{ transform:translateY(-1px); box-shadow:0 8px 22px rgba(124,111,240,0.28); }
.ghost-btn{
  background:transparent; border:1px solid var(--line); color:var(--text); border-radius:10px; padding:11px 20px;
  font-size:13.5px; font-weight:600; cursor:pointer; transition:border-color 0.15s ease, color 0.15s ease;
}
.ghost-btn:hover{ border-color:var(--accent); color:var(--accent); }

/* ---------- Module chrome ---------- */
.module-header{ margin-bottom:28px; }
.diff-tag{ display:inline-block; font-family:var(--mono); font-size:10.5px; letter-spacing:0.08em; text-transform:uppercase; padding:4px 10px; border-radius:6px; margin-bottom:10px; }
.diff-1{ background:var(--good-dim); color:var(--good); }
.diff-2{ background:var(--warn-dim); color:var(--warn); }
.diff-3{ background:rgba(124,111,240,0.14); color:var(--accent); }
.diff-4{ background:var(--bad-dim); color:var(--bad); }

.concept-block{ margin-bottom:34px; }
.concept-block h3{ font-size:19px; font-weight:700; margin-bottom:10px; display:flex; align-items:center; gap:10px; }
.concept-block h3 .num{ font-family:var(--mono); font-size:12px; color:var(--accent); border:1px solid var(--line); border-radius:6px; width:24px; height:24px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.concept-block > p{ color:var(--text-dim); font-size:14.5px; line-height:1.75; margin-bottom:14px; }

.analogy-box{
  background:var(--surface); border-left:3px solid var(--accent3); border-radius:0 10px 10px 0; padding:14px 18px; margin:14px 0;
}
.analogy-box .al-tag{ font-family:var(--mono); font-size:10.5px; color:var(--accent3); letter-spacing:0.06em; text-transform:uppercase; margin-bottom:6px; }
.analogy-box p{ font-size:13.5px; color:var(--text-dim); line-height:1.65; margin:0; }

.diagram-wrap{ background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:20px; margin:16px 0; overflow-x:auto; }

.compare-table{ width:100%; border-collapse:collapse; margin:14px 0; font-size:13px; }
.compare-table th, .compare-table td{ border:1px solid var(--line); padding:10px 12px; text-align:left; }
.compare-table th{ background:var(--surface2); font-family:var(--mono); font-size:11.5px; text-transform:uppercase; letter-spacing:0.05em; color:var(--text-dim); }
.compare-table td{ color:var(--text-dim); }

.misconception{
  background:var(--bad-dim); border-radius:10px; padding:12px 16px; margin:8px 0; font-size:13.5px; color:var(--text-dim); line-height:1.6;
  border-left:3px solid var(--bad);
}
.misconception strong{ color:var(--bad); }

.takeaways{ background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:18px 20px; margin:16px 0; }
.takeaways h4{ font-family:var(--mono); font-size:12px; letter-spacing:0.06em; text-transform:uppercase; color:var(--good); margin-bottom:10px; }
.takeaways ul{ padding-left:18px; display:flex; flex-direction:column; gap:6px; }
.takeaways li{ font-size:13.5px; color:var(--text-dim); line-height:1.55; }

.exercise-box{
  background:var(--surface2); border:1px solid var(--line); border-radius:12px; padding:18px 20px; margin:16px 0;
}
.exercise-box .ex-tag{ font-family:var(--mono); font-size:10.5px; letter-spacing:0.06em; text-transform:uppercase; color:var(--accent); margin-bottom:10px; }
.reveal-btn{
  margin-top:10px; background:none; border:1px dashed var(--line); color:var(--accent); border-radius:8px; padding:8px 14px;
  font-size:12.5px; cursor:pointer; font-family:var(--sans);
}
.reveal-btn:hover{ border-color:var(--accent); }
.reveal-content{ display:none; margin-top:12px; padding-top:12px; border-top:1px solid var(--line); }
.reveal-content.open{ display:block; animation:fadein 0.3s ease; }

.mc-option{
  display:flex; align-items:center; gap:10px; padding:10px 14px; border:1px solid var(--line); border-radius:9px;
  margin-bottom:8px; cursor:pointer; font-size:13.5px; transition:border-color 0.15s ease, background 0.15s ease;
}
.mc-option:hover{ border-color:var(--accent); }
.mc-option.picked{ border-color:var(--accent); background:var(--accent-dim); }
.mc-option.correct{ border-color:var(--good); background:var(--good-dim); }
.mc-option.incorrect{ border-color:var(--bad); background:var(--bad-dim); }
.mc-letter{ font-family:var(--mono); font-size:11.5px; width:20px; height:20px; border-radius:5px; background:var(--surface); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; flex-shrink:0; }

/* ---------- Quiz ---------- */
.quiz-panel{
  margin-top:40px; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:26px 28px;
}
.quiz-panel h2{ font-size:20px; font-weight:800; margin-bottom:4px; }
.quiz-panel .qz-sub{ font-size:13px; color:var(--text-faint); margin-bottom:22px; }
.quiz-q{ margin-bottom:26px; padding-bottom:22px; border-bottom:1px solid var(--line); }
.quiz-q:last-of-type{ border-bottom:none; }
.quiz-q .qz-num{ font-family:var(--mono); font-size:11px; color:var(--accent); margin-bottom:6px; letter-spacing:0.05em; }
.quiz-q .qz-question{ font-size:14.5px; font-weight:600; margin-bottom:12px; line-height:1.5; }
.qz-explain{ display:none; margin-top:10px; padding:10px 14px; border-radius:8px; font-size:13px; line-height:1.6; }
.qz-explain.show{ display:block; animation:fadein 0.3s ease; }
.qz-explain.right{ background:var(--good-dim); color:var(--text-dim); border-left:3px solid var(--good); }
.qz-explain.wrong{ background:var(--bad-dim); color:var(--text-dim); border-left:3px solid var(--bad); }

.quiz-actions{ display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-top:6px; }
.quiz-result{
  display:none; margin-top:20px; padding:20px; border-radius:12px; text-align:center; background:var(--surface2); border:1px solid var(--line);
}
.quiz-result.show{ display:block; animation:fadein 0.4s ease; }
.quiz-result .qr-score{ font-family:var(--mono); font-size:38px; font-weight:800; margin-bottom:4px; }
.quiz-result .qr-msg{ font-size:13.5px; color:var(--text-dim); margin-bottom:14px; }

/* ---------- footer nav / final / resources ---------- */
.module-footer{ display:flex; justify-content:space-between; margin-top:30px; flex-wrap:wrap; gap:12px; }

.cheatsheet-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:14px; margin:20px 0; }
.cs-card{ background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:16px 18px; }
.cs-card h4{ font-size:13.5px; margin-bottom:10px; color:var(--accent); }
.cs-card pre{ font-size:12px; padding:10px 12px; }

.resource-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:16px; margin:18px 0 30px; }
.resource-card{ background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:18px 20px; }
.resource-card h4{ font-family:var(--mono); font-size:11.5px; letter-spacing:0.06em; text-transform:uppercase; color:var(--accent); margin-bottom:12px; }
.resource-card ul{ list-style:none; display:flex; flex-direction:column; gap:8px; }
.resource-card li{ font-size:13px; color:var(--text-dim); line-height:1.5; }
.resource-card li b{ color:var(--text); }
.kw-chip-wrap{ display:flex; flex-wrap:wrap; gap:8px; }
.kw-chip{ font-family:var(--mono); font-size:11.5px; background:var(--surface2); border:1px solid var(--line); padding:5px 10px; border-radius:6px; color:var(--text-dim); }

@media print{
  .sidebar, .quiz-panel, .start-btn, .ghost-btn, .reveal-btn, .theme-toggle, .module-footer{ display:none !important; }
  body{ background:#fff; color:#000; }
  .section{ display:block !important; }
  main{ max-width:100%; padding:0; }
}
</style>
</head>
<body data-theme="dark">

<div class="app">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">OOP</div>
      <div class="brand-text">
        <div class="t1">Learning Studio</div>
        <div class="t2">PYTHON · OOP MASTERY</div>
      </div>
    </div>

    <div class="xp-card">
      <div class="xp-row"><span class="xp-label">Progress</span><span class="xp-val" id="progressPct">0%</span></div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <div class="xp-row" style="margin-top:12px;"><span class="xp-label">XP earned</span><span class="xp-val" id="xpVal">0 XP</span></div>
      <div class="badges-row" id="badgesRow"></div>
    </div>

    <nav class="navlist" id="navList"></nav>

    <div class="theme-toggle">
      <span>Dark mode</span>
      <button class="toggle-btn" id="themeToggleBtn" aria-label="Toggle theme"></button>
    </div>
  </aside>

  <!-- MAIN -->
  <main id="mainContent"></main>
</div>

<script>
/* ============================= CURRICULUM DATA ============================= */
const CURRICULUM = {
  intro: {
    title: "Object-Oriented Programming in Python",
    objectives: [
      "Explain what classes, objects, and instances are and how they relate",
      "Build classes with attributes, methods, and constructors",
      "Apply encapsulation, inheritance, and polymorphism correctly",
      "Use dunder (magic) methods to make custom objects behave like built-ins",
      "Design class hierarchies using abstraction, composition, and multiple inheritance"
    ],
    prereqs: ["Python syntax basics (variables, functions, loops)", "Comfort reading and writing simple functions", "No prior OOP experience required"],
    outcomes: "By the end you'll be able to design, build, and reason about real Python class hierarchies — the same patterns used in Django models, ORM libraries, GUI frameworks, and most production Python codebases.",
    time: "70–90 minutes",
    reward: "Earn XP and a badge after every module quiz. Score 75%+ to unlock the next module — you can always retry."
  },
  modules: [
    {
      id: 1, key:"foundations", title:"Classes, Objects & the Basics", difficulty:1, diffLabel:"Foundational",
      badge:"F", est:"15–20 min",
      sections: [
        {
          h:"What is Object-Oriented Programming?",
          p:"OOP is a way of organizing code around <b>objects</b> — bundles of data (attributes) and behavior (methods) — instead of just writing loose functions and variables. A <code>class</code> is a blueprint that defines what an object looks like and what it can do. An <code>object</code> (or <em>instance</em>) is a concrete thing built from that blueprint.",
          analogy:"Think of a class as a cookie cutter and objects as the cookies it stamps out. The cutter defines the shape (attributes) and what you can do with it (methods) — but every cookie you stamp is its own separate cookie. Changing one cookie's frosting doesn't change the others.",
          diagram:`<svg width="100%" viewBox="0 0 640 200" xmlns="http://www.w3.org/2000/svg">
            <rect x="20" y="60" width="140" height="80" rx="10" fill="var(--surface2)" stroke="var(--accent)" stroke-width="1.5"/>
            <text x="90" y="95" text-anchor="middle" font-family="ui-monospace,monospace" font-size="13" fill="var(--text)" font-weight="700">class Dog</text>
            <text x="90" y="118" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="var(--text-dim)">blueprint</text>
            <line x1="160" y1="100" x2="230" y2="100" stroke="var(--accent)" stroke-width="1.5" marker-end="url(#ah)"/>
            <defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="var(--accent)" stroke-width="1.5"/></marker></defs>
            <g>
              <rect x="240" y="30" width="110" height="60" rx="9" fill="var(--surface)" stroke="var(--line)"/>
              <text x="295" y="55" text-anchor="middle" font-size="12" font-family="ui-monospace,monospace" fill="var(--text)">rex = Dog()</text>
              <text x="295" y="74" text-anchor="middle" font-size="10.5" fill="var(--text-faint)">object #1</text>
            </g>
            <g>
              <rect x="240" y="105" width="110" height="60" rx="9" fill="var(--surface)" stroke="var(--line)"/>
              <text x="295" y="130" text-anchor="middle" font-size="12" font-family="ui-monospace,monospace" fill="var(--text)">fido = Dog()</text>
              <text x="295" y="149" text-anchor="middle" font-size="10.5" fill="var(--text-faint)">object #2</text>
            </g>
            <g>
              <rect x="380" y="30" width="240" height="135" rx="9" fill="none" stroke="var(--line)" stroke-dasharray="4 4"/>
              <text x="500" y="20" text-anchor="middle" font-size="10.5" fill="var(--text-faint)">each object has its own data</text>
              <text x="500" y="70" text-anchor="middle" font-size="11.5" font-family="ui-monospace,monospace" fill="var(--accent3)">rex.name = "Rex"</text>
              <text x="500" y="95" text-anchor="middle" font-size="11.5" font-family="ui-monospace,monospace" fill="var(--accent3)">fido.name = "Fido"</text>
              <text x="500" y="130" text-anchor="middle" font-size="11" fill="var(--text-dim)">same blueprint,</text>
              <text x="500" y="148" text-anchor="middle" font-size="11" fill="var(--text-dim)">independent data</text>
            </g>
          </svg>`,
          code:`<span class="kw">class</span> <span class="fn">Dog</span>:
    <span class="kw">def</span> <span class="fn">__init__</span>(self, name, breed):
        self.name = name        <span class="cm"># instance attribute</span>
        self.breed = breed      <span class="cm"># instance attribute</span>

    <span class="kw">def</span> <span class="fn">bark</span>(self):
        <span class="kw">return</span> <span class="str">f"{self.name} says woof!"</span>

/* ============================= RENDER: SIDEBAR ============================= */
function renderSidebar(){
  const nav = document.getElementById("navList");
  const items = [{key:"intro", label:"Introduction", sub:"Start here"}];
  CURRICULUM.modules.forEach((m,i)=>{
    items.push({key:"m"+m.id, label:"Module "+m.id, sub:m.title, unlockedIdx:i});
  });
  items.push({key:"challenge", label:"Final Challenge", sub:"Capstone project", unlockedIdx:4});
  items.push({key:"cheatsheet", label:"Cheat Sheet", sub:"Quick reference", always:true});
  items.push({key:"resources", label:"Continue Learning", sub:"Books, docs, more", always:true});

  nav.innerHTML = items.map(it=>{
    const isUnlocked = it.always || (it.unlockedIdx!==undefined ? state.unlocked[it.unlockedIdx] : true);
    const isActive = state.currentSection === it.key;
    const done = it.key.startsWith("m") && it.key!=="m" ? state.quizDone[parseInt(it.key.slice(1))-1] : false;
    let dotContent = done ? "\u2713" : (it.key.startsWith("m") ? it.key.slice(1) : "");
    return `<div class="nav-item ${isActive?'active':''} ${!isUnlocked?'locked':''}" onclick="${isUnlocked? `showSection('${it.key}')` : ''}">
      <span class="nav-dot ${done?'done':''} ${isActive?'current':''}">${isUnlocked? (dotContent||'&#8226;') : '&#128274;'}</span>
      <span>${it.label}<div class="nav-sub">${it.sub}</div></span>
    </div>`;
  }).join("");

  // progress + XP
  const doneCount = state.quizDone.filter(Boolean).length;
  const pct = Math.round((doneCount/4)*100);
  document.getElementById("progressPct").textContent = pct+"%";
  document.getElementById("progressFill").style.width = pct+"%";
  const xp = state.quizScores.reduce((a,b)=>a+b,0)*25;
  document.getElementById("xpVal").textContent = xp+" XP";
  const badgesRow = document.getElementById("badgesRow");
  badgesRow.innerHTML = CURRICULUM.modules.map((m,i)=>`<div class="badge-chip ${state.quizDone[i]?'earned':''}" title="${m.title}">${m.badge}</div>`).join("");
}

/* ============================= NAVIGATION ============================= */
function showSection(key){
  state.currentSection = key;
  saveState();
  const main = document.getElementById("mainContent");
  let html = "";
  if(key==="intro") html = renderIntro();
  else if(key.startsWith("m")){
    const num = parseInt(key.slice(1));
    const idx = num-1;
    html = renderModule(CURRICULUM.modules[idx], idx);
  }
  else if(key==="challenge") html = renderChallenge();
  else if(key==="cheatsheet") html = renderCheatsheet();
  else if(key==="resources") html = renderResources();

  main.innerHTML = `<div class="section active">${html}</div>`;
  renderSidebar();
  window.scrollTo({top:0, behavior:"smooth"});
}

function resetQuiz(mid){
  Object.keys(quizPicks).forEach(k=>{ if(k.startsWith(mid+"-")) delete quizPicks[k]; });
  document.querySelectorAll(`#quiz-${mid} .mc-option`).forEach(el=>el.classList.remove("picked","correct","incorrect"));
  document.querySelectorAll(`#quiz-${mid} .qz-explain`).forEach(el=>{el.classList.remove("show","right","wrong"); el.innerHTML="";});
  document.getElementById(`result-${mid}`).classList.remove("show");
}

function submitQuiz(mid, idx){
  const m = CURRICULUM.modules[idx];
  let correctCount = 0;
  m.quiz.forEach((q,qi)=>{
    const key = mid+"-"+qi;
    const picked = quizPicks[key];
    const expEl = document.getElementById(`exp-${mid}-${qi}`);
    if(picked===undefined){
      expEl.classList.add("show","wrong");
      expEl.innerHTML = "No answer selected. " + q.exp;
      return;
    }
    const isCorrect = picked===q.correct;
    if(isCorrect) correctCount++;
    document.querySelectorAll(`#opts-${mid}-${qi} .mc-option`).forEach((el,oi)=>{
      if(oi===q.correct) el.classList.add("correct");
      else if(oi===picked && !isCorrect) el.classList.add("incorrect");
    });
    expEl.classList.add("show", isCorrect?"right":"wrong");
    expEl.innerHTML = (isCorrect ? "Correct. " : "Not quite. ") + q.exp;
  });

  const pct = Math.round((correctCount/m.quiz.length)*100);
  const resultEl = document.getElementById(`result-${mid}`);
  resultEl.classList.add("show");
  const passed = pct>=75;
  resultEl.innerHTML = `
    <div class="qr-score" style="color:${passed?'var(--good)':'var(--warn)'}">${correctCount}/${m.quiz.length}</div>
    <div class="qr-msg">${pct}% — ${passed? "Great work, module complete." : "Review the explanations above and retry when ready."}</div>
    ${passed ? `<button class="start-btn" onclick="unlockNext(${idx})">Continue →</button>` : `<button class="ghost-btn" onclick="resetQuiz(${mid})">Retry quiz</button>`}
  `;

  state.quizDone[idx] = passed || state.quizDone[idx];
  state.quizScores[idx] = Math.max(state.quizScores[idx], correctCount);
  if(passed && idx+1 < state.unlocked.length) state.unlocked[idx+1] = true;
  saveState();
  renderSidebar();
}

function unlockNext(idx){
  const nextKey = idx+1 < CURRICULUM.modules.length ? "m"+(idx+2) : "challenge";
  showSection(nextKey);
}

/* ============================= THEME ============================= */
function applyTheme(){
  document.body.setAttribute("data-theme", state.theme);
}
document.getElementById("themeToggleBtn").addEventListener("click", ()=>{
  state.theme = state.theme==="dark" ? "light" : "dark";
  applyTheme();
  saveState();
});

/* ============================= INIT ============================= */
applyTheme();
showSection(state.currentSection || "intro");
</script>
</body>
</html>
